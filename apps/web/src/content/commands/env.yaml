name: env
title: Show or change the environment for a command
category: shell
level: everyday
summary: With no arguments, prints every environment variable, one `NAME=value` per line. Followed by a command, it runs that command with variables added, removed or cleared.
syntax: env [-i] [-u NAME] [NAME=value…] [command [args…]]
flags:
  - { flag: "NAME=value", meaning: "Set a variable for the command that follows." }
  - { flag: "-u NAME, --unset=NAME", meaning: "Run the command without NAME." }
  - { flag: "-i, --ignore-environment", meaning: "Start with an empty environment. Good for testing what a program needs." }
  - { flag: "-0", meaning: "End each line with a NUL byte, for values that contain newlines." }
examples:
  - { command: "env | grep -E '^(PORT|NODE_ENV)='", explain: "Check two variables without printing every secret in your environment.", severity: readonly }
  - { command: "env | sort | less", explain: "Browse everything, alphabetically.", severity: readonly }
  - { command: "env -u PORT npm run dev", explain: "Run once as if PORT weren't set.", severity: modifies }
  - { command: "env NODE_ENV=production node server.js", explain: "Same as `NODE_ENV=production node server.js`, written with `env`. You'll see this form in scripts and Dockerfiles.", severity: modifies }
gotchas:
  - "`env` prints tokens and API keys along with everything else. Filter it before you share the output."
  - "It shows exported variables only. A plain `NAME=value` in your shell isn't there until you `export` it."
  - "`printenv NAME` prints one variable's value, and exits 1 if it isn't set."
  - "Scripts often start with `#!/usr/bin/env bash`. That `env` finds `bash` on your PATH instead of hard-coding where it lives."
related: [export, set, bash, echo]
scenarios: [env-vars]

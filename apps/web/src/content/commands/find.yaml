name: find
title: Find files by name, type, size or age
category: files
level: intermediate
summary: Walks a folder tree and prints the files that match. It can also act on each match, including deleting it.
syntax: find [path…] [tests] [actions]
flags:
  - { flag: "-name PATTERN", meaning: "Match the file name, like `-name \"*.log\"`. Quote the pattern." }
  - { flag: "-iname PATTERN", meaning: "Like `-name`, but case-insensitive." }
  - { flag: "-type TYPE", meaning: "`f` for files, `d` for folders, `l` for symlinks." }
  - { flag: "-mtime N", meaning: "Modified N days ago; `+7` means more than 7 days ago." }
  - { flag: "-size N", meaning: "By size, like `+100M` for files over 100 MB." }
  - { flag: "-maxdepth N", meaning: "Don't descend more than N levels." }
  - { flag: "-exec CMD {} \\;", meaning: "Run CMD once per match, with `{}` replaced by the file. The `\\;` ends the command; the backslash stops the shell from eating the `;`." }
  - { flag: "-exec CMD {} +", meaning: "Run CMD once with as many matches as fit on one command line. Much faster, and what you want for `rm`, `grep`, `chmod`." }
  - { flag: "-ok CMD {} \\;", meaning: "Like `-exec … \\;`, but asks y/n before each file." }
  - { flag: "-delete", meaning: "Delete every match. No confirmation." }
  - { flag: "-print0", meaning: "Separate results with a NUL byte, for `xargs -0`; safe with spaces in names." }
  - { flag: "-user NAME", meaning: "Owned by NAME. `! -user \"$USER\"` finds files that aren't yours." }
examples:
  - { command: "find . -name \"*.ts\" -not -path \"./node_modules/*\"", explain: "All TypeScript files outside node_modules.", severity: readonly }
  - { command: "find ~/Downloads -type f -size +500M", explain: "Big files in Downloads.", severity: readonly }
  - { command: "find . -name \"*.log\" -mtime +7 -delete", explain: "Delete log files older than a week.", severity: modifies }
  - { command: "find ~ -iname \"*invoice*\"", explain: "Every file with \"invoice\" in its name, any case.", severity: readonly }
  - { command: "find ~ -type f -size +1G -exec ls -lh {} +", explain: "Files over 1 GB, with sizes. `-exec ls` only lists them.", severity: readonly }
  - { command: "find . -name \"*.orig\" -exec echo rm {} +", explain: "Dry run: print the `rm` command instead of running it.", severity: readonly }
  - { command: "find . -name \"*.orig\" -print0 | xargs -0 rm", explain: "The same delete through `xargs`, safe with spaces in names.", severity: modifies }
gotchas:
  - "Run the command without `-delete` first and check the list. `-delete` acts on every line you would have seen."
  - "Put `-delete` last. `find . -delete -name x` deletes everything, because the tests are evaluated in order."
  - "`find … | xargs rm` breaks on names with spaces. Use `-exec rm {} +`, `-delete`, or `-print0 | xargs -0`."
  - "Forgetting `\\;` or `+` at the end fails with a `missing argument to -exec` error."
  - "Quote patterns (`\"*.log\"`), or the shell expands them before `find` sees them."
  - "Unquoted, `find ~ -name *invoice*` is expanded by the shell first. It silently searches for one exact name, or fails with `paths must precede expression`."
related: [grep, ls, rm, rg, chown, xargs]
scenarios: [disk-full, find-files, root-owned-files, find-exec-xargs]

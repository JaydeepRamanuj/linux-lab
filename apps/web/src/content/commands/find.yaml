name: find
title: Find files by name, type, size or age
category: files
level: intermediate
summary: Walks a folder tree and prints the files that match. It can also act on each match, including deleting it.
syntax: find [path…] [tests] [actions]
flags:
  - { flag: "-name PATTERN", meaning: "Match the file name, like `-name \"*.log\"`. Quote the pattern." }
  - { flag: "-iname PATTERN", meaning: "Like `-name`, but case-insensitive." }
  - { flag: "-type TYPE", meaning: "`f` for files, `d` for folders, `l` for symlinks." }
  - { flag: "-mtime N", meaning: "Modified N days ago; `+7` means more than 7 days ago." }
  - { flag: "-size N", meaning: "By size, like `+100M` for files over 100 MB." }
  - { flag: "-maxdepth N", meaning: "Don't descend more than N levels." }
  - { flag: "-exec CMD {} ;", meaning: 'Run a command on each match; `{}` is the file. End with `\;` (once per file) or `+` (batched).' }
  - { flag: "-delete", meaning: "Delete every match. No confirmation." }
  - { flag: "-print0", meaning: "Separate results with a NUL byte, for `xargs -0`; safe with spaces in names." }
examples:
  - { command: "find . -name \"*.ts\" -not -path \"./node_modules/*\"", explain: "All TypeScript files outside node_modules.", severity: readonly }
  - { command: "find ~/Downloads -type f -size +500M", explain: "Big files in Downloads.", severity: readonly }
  - { command: "find . -name \"*.log\" -mtime +7 -delete", explain: "Delete log files older than a week.", severity: modifies }
gotchas:
  - "Run the command without `-delete` first and check the list. `-delete` acts on every line you would have seen."
  - "Put `-delete` last. `find . -delete -name x` deletes everything, because the tests are evaluated in order."
  - "Quote patterns (`\"*.log\"`), or the shell expands them before `find` sees them."
related: [grep, ls, rm]

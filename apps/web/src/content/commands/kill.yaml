name: kill
title: Send a signal to a process
category: processes
level: everyday
summary: Sends a signal to a process by its PID. The default, SIGTERM, asks it to exit; `-9` forces it.
syntax: kill [-signal] PID…
flags:
  - { flag: "-15, -TERM", meaning: "SIGTERM, the default: ask the process to shut down cleanly." }
  - { flag: "-9, -KILL", meaning: "SIGKILL: the kernel ends the process immediately. No cleanup, no saving." }
  - { flag: "-2, -INT", meaning: "SIGINT: the same as pressing Ctrl+C in its terminal." }
  - { flag: "-1, -HUP", meaning: "SIGHUP: many servers reload their config when they get it." }
  - { flag: "-l", meaning: "List signal names." }
examples:
  - { command: "kill 48213", explain: "Ask a process to stop.", severity: modifies }
  - { command: "kill $(lsof -t -i :3000)", explain: "Stop whatever is listening on port 3000.", severity: modifies }
  - { command: "kill -9 48213", explain: "Force it, if it ignored the polite request.", severity: modifies }
gotchas:
  - "`kill -9 -1` doesn't mean \"PID 1\": `-1` targets every process you own, including your desktop session."
  - "Try plain `kill` first and wait a few seconds; `-9` can leave lock files and half-written data behind."
related: [pkill, ps, lsof, pgrep, jobs]
scenarios: [port-in-use, frozen-app, stopped-job]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="linux-lab">
  <title>linux-lab</title>
  <!-- Tile -->
  <rect width="64" height="64" rx="14" fill="#141a2e" />
  <!-- Terminal window -->
  <rect x="9" y="12" width="46" height="40" rx="7" fill="none" stroke="#8083ff" stroke-opacity="0.6" stroke-width="2" />
  <circle cx="15.5" cy="18.5" r="1.8" fill="#f2b8b5" />
  <circle cx="21" cy="18.5" r="1.8" fill="#fbbf24" />
  <circle cx="26.5" cy="18.5" r="1.8" fill="#4ade80" />
  <!-- Prompt: >_ -->
  <polyline points="18,28 25.5,34 18,40" fill="none" stroke="#4cd7f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="29.5" y1="41" x2="40" y2="41" stroke="#e8e8ff" stroke-width="4" stroke-linecap="round" />
</svg>

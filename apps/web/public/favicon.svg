<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="linux-lab">
  <title>linux-lab</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b" />
      <stop offset="1" stop-color="#0b1220" />
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc" />
      <stop offset="1" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>
  <!-- Tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#8083ff" stroke-opacity="0.45" stroke-width="1.5" />
  <!-- Flippers -->
  <ellipse cx="15.5" cy="40" rx="3.4" ry="9" transform="rotate(18 15.5 40)" fill="#111827" stroke="#8083ff" stroke-width="1.2" />
  <ellipse cx="48.5" cy="40" rx="3.4" ry="9" transform="rotate(-18 48.5 40)" fill="#111827" stroke="#8083ff" stroke-width="1.2" />
  <!-- Body -->
  <ellipse cx="32" cy="36" rx="17" ry="21.5" fill="#111827" stroke="#8083ff" stroke-width="1.5" />
  <!-- Belly: a terminal -->
  <ellipse cx="32" cy="41.5" rx="11.5" ry="13.5" fill="url(#belly)" />
  <polyline points="25.5,37.5 29.5,41 25.5,44.5" fill="none" stroke="#0891b2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="31.5" y1="45" x2="38" y2="45" stroke="#0891b2" stroke-width="2.4" stroke-linecap="round" />
  <!-- Eyes -->
  <circle cx="26.6" cy="23.5" r="3.6" fill="#f8fafc" />
  <circle cx="37.4" cy="23.5" r="3.6" fill="#f8fafc" />
  <circle cx="27.4" cy="24.1" r="1.7" fill="#0b1220" />
  <circle cx="36.6" cy="24.1" r="1.7" fill="#0b1220" />
  <!-- Beak -->
  <path d="M27.6 29.2 Q32 26.8 36.4 29.2 Q32 34 27.6 29.2 Z" fill="#fbbf24" />
  <!-- Feet -->
  <ellipse cx="24.5" cy="57.3" rx="5.4" ry="2.5" fill="#fbbf24" />
  <ellipse cx="39.5" cy="57.3" rx="5.4" ry="2.5" fill="#fbbf24" />
</svg>
